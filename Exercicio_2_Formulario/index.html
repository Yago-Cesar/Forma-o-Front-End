<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChargePay</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Charge<h2>Pay</h2></h1>
            <p>Compre seu Carregador</p>
        </div>
        <div class="form-container">
            <div class="form-header">
                <p>Formulario</p>
            </div>
            <form>
                <div class="form-body">
                    <h1 class="form--title">Adquira seu carregador</h1>
                    <p>Marque as opcionais de preferencia do seu carregador</p>
                    <div class="info-client">
                        <h3>Dados do Cliente</h3>
                        <div class="box-input">
                            <label for="name">Nome <span class="required-field">*</span></label>
                            <input type="text" name="name" id="name" class="block" placeholder="Digite seu nome" minlength="1" maxlength="100" required>
                        </div>
                        <div class="box-input">
                            <label for="email">Email <span class="required-field">*</span></label>
                            <input type="email" name="email" id="email" class="block" placeholder="Digite seu email" minlength="1" maxlength="80" required>
                        </div>
                        <div class="box-input">
                            <label for="telephone">Telefone <span class="required-field">*</span></label>
                            <input type="number" name="telephone" id="telephone" class="block" placeholder="Digite seu telefone" minlength="1" maxlength="11" required>
                        </div>
                    </div>
                    <div class="info-car">
                        <h3>Informações do veículo</h3>
                        <div class="box-input">
                            <label for="brand">Marca <span class="required-field">*</span></label>
                            <input type="text" name="brand" id="brand" class="block" placeholder="Digite a marca do seu veículo" required>
                        </div>
                        <div class="box-input">
                            <label for="model">Modelo <span class="required-field">*</span></label>
                            <input type="text" name="model" id="model" class="block" placeholder="Digite o modelo do seu veículo" required>
                        </div>
                        <div class="box-input">
                            <label for="fabrication-year">Ano de Fabricação <span class="required-field">*</span></label>
                            <input type="date" name="fabrication-year" id="fabrication-year" class="block" required>
                        </div>
                        <div class="radio-input">
                            <p>Tipo de Bateria</p>
                            <input type="radio" id="small-size" name="battery">
                            <label for="small-size">Urbano (20/40 kWh)</label>
                            <input type="radio" id="medium-size" name="battery">
                            <label for="medium-size">Padrão (50/80 kWh)</label>
                            <input type="radio" id="large-size" name="battery">
                            <label for="large-size">Premium (90/130+ kWh)</label>
                        </div>
                        <div class="box-input">
                            <label for="mounting-location">Local de Montagem<span class="required-field">*</span></label>
                            <textarea name="mounting-location" id="mounting-location" required class="block" placeholder="Coloque aonde será feita a instalação do Carregador"></textarea>
                        </div>
                        <div class="box-input">
                            <label for="images">Fotos do Local de Montagem<span class="required-field">*</span></label>
                            <input type="file" multiple accept="image.jpg, image.png" id="images" name="images" required>
                        </div>
                    </div>   
                    <input type="submit" value="Enviar" class="btn-submit">
                </div>
            </form>
        </div>
        <div class="footer">
            <h1>Charge<h2>Pay</h2></h1>
            <h3>Suporte Via</h3>
            <p>Whatsapp: (22)9999-9999</p>
            <p>Email: chargepay@gmail.com</p>
        </div>
    </div>
</body>
</html>
