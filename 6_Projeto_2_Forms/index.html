<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h3>Cadastre seu Veiculo para vender mais rapido!</h3>
        </div>
    </div>
    <div class="form-container">
        <div class="form-header">
            <p>Formulario</p>
        </div>
        <form>
            <div class="form-body">
                    <h1 class="form-title">Venda facil seu Carro!</h1>
                    <p>Descreva as caracteristicas e marque as opcionais que ele possui</p>
                <div class="box-input">
                    <label for="title">Titulo do anúcio<span class="required-field">*</span></label>
                    <input type="text" name="title" id="title" class="block" placeholder="um título para anunciar seu carro"        minlength="1"
                    maxlength="30"
                    required>
                </div>
                <div class="box-input">
                    <label for="price">Preço:<span class="required-field">*</span></label>
                    <input type="number" name="price" id="price" class="block" placeholder="Defina um preço"
                    required>
                </div>
                <div class="box-input">
                    <label for="description">Descrição:<span class="required-field">*</span></label>
                    <textarea name="description" id="description" class="block" placeholder="Aqui você coloca os detalhes do veículo.
    ex:Tem um arranhão na porta"></textarea>
                </div>
                <div class="box-input">
                    <label for="brand">Marca:<span class="required-field">*</span></label>
                    <input type="text" name="brand" id="brand" class="block" placeholder="Digite a marca do veículo"
                    required>
                </div>
                <div class="box-input">
                    <label for="model">Modelo:<span class="required-field">*</span></label>
                    <input type="text" name="model" id="model" class="block" placeholder="Digite o modelo do veículo"
                    required>
                </div>
                <div class="box-input">
                    <label for="mileage">Kilometragem<span class="required-field">*</span></label>
                    <input type="number" name="mileage" id="mileage" class="block" placeholder="Digite a Kilometragem do veículo"
                    required>
                </div>
                <div class="box-input">
                    <label for="purchase">Data de Compra<span class="required-field">*</span></label>
                    <input type="date" name="purchase" id="purchase" class="block"
                    required>
                </div>
                <div class="box-input">
                    <p>Tipo de câmbio <span class="required-field">*</span></p>
                    <input type="radio" id="manual" name="gear">
                    <label for="manual">Manual</label>
                    <input type="radio" id="auto" name="gear">
                    <label for="auto">Automático</label>
                </div>
                <div class="optional-box">
                    <p>Opcionais<span class="required-field">*</span></p>
                    <ul class="optional-list">
                        <li>
                            <input type="checkbox" id="airbag" name="optional[]"
                            value="airbag">
                            <label for="airbag">Airbag</label>
                        </li>
                        <li>
                            <input type="checkbox" id="alarm" name="optional[]"
                            value="alarm">
                            <label for="alarm">Alarme</label>
                        </li>
                        <li>
                            <input type="checkbox" id="ac" name="optional[]"
                            value="ac">
                            <label for="ac">Ar Condicionado</label>
                        </li>
                        <li>
                            <input type="checkbox" id="reverse-camera" name="optional[]"
                        value="reverse-camera">
                        <label for="reverse-camera">Câmera de Ré</label>
                        </li> 
                    </ul>
                </div>
                <div class="optional-box">
                    <ul class="optional-list">
                        <li>
                            <input type="checkbox" id="lane-assist" name="optional[]"
                            value="lane-assist">
                            <label for="lane-assist">Assistente de Pista</label>
                        </li>
                        <li>
                            <input type="checkbox" id="keyless" name="optional[]"
                            value="keyless">
                            <label for="keyless">Partida</label>
                        </li>
                        <li>
                            <input type="checkbox" id="smartphone" name="optional[]"
                            value="smartphone">
                            <label for="smartphone">Integração com Celular</label>
                        </li>
                        <li>
                            <input type="checkbox" id="leather-seat" name="optional[]"
                        value="leather-seat">
                        <label for="leather-seat">Banco de Couro</label>
                        </li> 
                    </ul>
                </div>
                <div class="box-inout">
                    <p>Fotos do carro: <span class="required-field">*</span></p>
                    <input type="file" multiple accept="image/png, image/jpg" id="images" name="images" required>
                </div>
                <input type="submit" value="Enviar" class="btn-submit">
            </div>
        </form>    
    </div>
</body>
</html>
