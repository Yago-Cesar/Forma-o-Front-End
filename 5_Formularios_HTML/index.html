<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <h2>Fomularios HTML</h2>
    <!-- 1 - Primeiro formulario -->
    <!-- 2 - Atributos formulário   -->
    <form action="register.php" method="POST">
        <div>
            <label>Nome:</label>
            <input type="text">
        </div>
        <!-- 3 - Atributo name -->
        <div>
            <!-- Atributos label -->
            <label for="age">Idade:</label>
            <input type="text" name="age">
        </div>
        <!-- 6 - Select -->
        <div>
            <select name="job">
                <option value="programador">Programador</option>
                <option value="engenheiro">Engenheiro</option>
                <option value="pintor">Pintor</option>
            </select>
        </div>
        <!-- 7 - atributo selected -->
         <div>
            <label for="contract">Você leu os termos do contrato</label>
            <select name="contract">
                <option value="sim">Sim</option>
                <option value="não" selected>Não</option>
            </select>
         </div>
        
        <!-- 8 - Atributo Multiple -->
        <div>
            <label for="sandwich">Escolha oque você quer no seu lanche</label>
            <select name="sandwich" multiple>
                <option value="carne">Carne</option>
                <option value="frango">Frango</option>
                <option value="salada">Salada</option>
                <option value="ketchup">Ketchup</option>
                <option value="onion">Onion Ring</option>
            </select>
        </div>
        <!-- 9 - Textarea -->
        <div>
            <label for="comment">Comentário:</label>
            <textarea name="comment"></textarea>
        </div>
        <!-- 10 - fieldset e legend -->
         <div>
            <fieldset>
                <legend>Preencha as suas informações:</legend>
                <label for="firstname">Nome:</label>
                <input type="text" name="firstname">
                <label for="lastname">Sobrenome:</label>
                <input type="text" name="lastname">
            </fieldset>
         </div>
         <!-- 11 - Datalist  -->
         <div>
            <label for="flavor">Escolha um dos Sabores:</label>
            <input type="text" list="flavors" name="flavor">

            <datalist id="flavors">
                <option value="Cereja"></option>
                <option value="Chocolate"></option>
                <option value="Abacaxi"></option>
                <option value="Morango"></option>
                <option value="Kiwi"></option>
                <option value="Cocô"></option>
            </datalist>
         </div>

         <!-- 12 - Input with Password -->
         <div>
            <label for="password">Digite sua senha:</label>
            <input type="password" name="password">
         </div>
         <!-- 14 - Radio button -->
         <div>
           <label for="car_model">Escolha o modelo do carro:</label>
           <div class="radio">
               <input type="radio" value="bmw" name="car_model">
               <label for="bmw">BMW</label>
           </div>
           <div class="radio">
               <input type="radio" value="ferrari " name="car_model">
               <label for="ferrari">Ferrari</label>
           </div>
           <div class="radio">
               <input type="radio" value="renault" name="car_model">
               <label for="renault">Renault</label>
           </div>
         <!-- 13 - Limpar Form -->
          <div>
            <input type="reset" value="Limpar">
          </div>
          </div>
        <!-- 5 - Enviando formulario -->
        <input type="submit" value="Enviar" />
    </form>
</body>
</html>
